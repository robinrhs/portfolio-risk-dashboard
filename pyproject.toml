[project]
name = "portfolio-risk-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for the risk and performance of a stock/ETF portfolio: Sharpe, Sortino, drawdown, beta, VaR/ES, risk contributions and an efficient frontier."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robin-Philip Rehschuh" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "scipy>=1.17.1",
    "streamlit>=1.66.1",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
